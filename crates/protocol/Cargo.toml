[package]
name = "gmux-protocol"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Shared execution protocol and terminal values for Gmux"
license = "MIT"

[lints]
workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
async = ["dep:futures-lite"]

[dependencies.futures-lite]
version = "2"
default-features = false
features = ["std"]
optional = true
