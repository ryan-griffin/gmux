[package]
name = "gmux-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Daemon connections and cached terminal sessions for Gmux clients"
license = "MIT"

[lints]
workspace = true

[dependencies]
gmux-protocol = { path = "../protocol", features = ["async"] }
gmux-platform = { path = "../platform" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "process"] }
tokio-util = { version = "0.7", features = ["compat"] }
