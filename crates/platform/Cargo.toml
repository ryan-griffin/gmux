[package]
name = "gmux-platform"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Shared platform services for Gmux"
license = "MIT"

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
gmux-protocol = { path = "../protocol" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
directories = "6"
event-listener = "5"
