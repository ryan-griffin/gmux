name: Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  headless:
    name: Headless
    runs-on: ubuntu-24.04
    # Ubuntu supplies the Docker host; all job steps run inside Fedora.
    container: registry.fedoraproject.org/fedora:44@sha256:cd3513b19e87220eb6fba1aeb041cf88f9c00c3b1de213c36db7532c383f4a1c
    defaults:
      run:
        shell: bash
    env:
      CARGO_HOME: ${{ github.workspace }}/.ci-cache/cargo
      RUSTUP_HOME: ${{ github.workspace }}/.ci-cache/rustup
      CARGO_TARGET_DIR: ${{ github.workspace }}/.ci-cache/target
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.ci-cache/zig
      LANG: C.UTF-8
    timeout-minutes: 45
    steps:
      - name: Install Git for checkout inside Fedora
        run: dnf --assumeyes --setopt=install_weak_deps=False install git

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install and verify Fedora dependencies
        id: environment
        run: |
          bash ci/install-deps.sh
          echo "packages=$(sha256sum artifacts/packages.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Read the development Rust toolchain
        id: rust
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("rust-toolchain.toml").read_text())["toolchain"]["channel"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
          PY

      - name: Cache Rust dependencies and build outputs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .ci-cache/cargo/registry
            .ci-cache/cargo/git
            .ci-cache/rustup
            .ci-cache/target
          key: rust-fedora44-${{ runner.arch }}-${{ steps.environment.outputs.packages }}-${{ steps.rust.outputs.version }}-${{ hashFiles('.github/workflows/check.yml', 'ci/install-deps.sh', 'scripts/bootstrap-ghostty.py', 'scripts/patches/**') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            rust-fedora44-${{ runner.arch }}-${{ steps.environment.outputs.packages }}-${{ steps.rust.outputs.version }}-${{ hashFiles('.github/workflows/check.yml', 'ci/install-deps.sh', 'scripts/bootstrap-ghostty.py', 'scripts/patches/**') }}-

      - name: Cache Ghostty and Zig dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .deps
            .ci-cache/zig
          key: ghostty-fedora44-${{ runner.arch }}-${{ steps.environment.outputs.packages }}-${{ hashFiles('.github/workflows/check.yml', 'ci/install-deps.sh', 'scripts/bootstrap-ghostty.py', 'scripts/patches/**') }}

      - name: Bootstrap Ghostty and run the headless checks
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.rust.outputs.version }}
        run: bash ci/check.sh

      - name: Preserve check output and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: headless
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14
