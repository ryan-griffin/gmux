[package]
name = "gmux-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
description = "Persistent terminal execution for Gmux"
license = "MIT"
build = "build.rs"
links = "gmux-ghostty"

[workspace]
members = ["crates/protocol", "crates/platform", "crates/client", "crates/cli", "crates/gtk"]
default-members = [".", "crates/protocol", "crates/platform", "crates/client", "crates/cli", "crates/gtk"]
resolver = "3"

[workspace.lints.rust]
warnings = "deny"

[lints]
workspace = true

[dependencies]
gmux-protocol = { path = "crates/protocol" }
gmux-platform = { path = "crates/platform" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
libc = "0.2"
subtle = "2.6"

[dev-dependencies]
gmux-client = { path = "crates/client" }

[build-dependencies]
bindgen = { version = "0.73", default-features = false, features = ["runtime"] }
cc = "1"

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
