[package]
name = "gmux"
version = "0.1.0"
edition = "2024"
default-run = "gmux"
description = "A GNOME terminal with workspaces, split panes, and agent notifications"
license = "MIT"
build = "build.rs"

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_9"] }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_22"] }
clap = { version = "4.5", features = ["derive", "env"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
libc = "0.2"
directories = "6"
glib = "0.22"
glib-unix = "0.22"

[build-dependencies]
cc = "1"

# The renderer smoke suite runs these tools. Their included render module's
# unit tests already run in the application target.
[[example]]
name = "renderer-benchmark"
test = false

[[example]]
name = "renderer-check"
test = false

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
strip = true
